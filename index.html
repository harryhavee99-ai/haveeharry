<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkaDoosh — AI Video Clipping &amp; High-End Caption Studio</title>
    <meta name="description" content="AI-powered automatic video clipping and high-end animated caption studio that transforms videos and transcripts into voice-synced captioned MP4s." />
    <meta property="og:title" content="SkaDoosh — AI Video Clipping &amp; High-End Caption Studio" />
    <meta property="og:description" content="Transform videos up to 5 hours or transcript files into voiceover-synced captioned MP4s, Chroma Green Screen caption overlays, and viral clips." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Cinzel:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:ital,wght@0,500..900;1,500..900&family=Noto+Nastaliq+Urdu:wght@400..700&family=Noto+Sans+Arabic:wght@400..800&family=Oswald:wght@500;600;700&family=Outfit:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600..800;1,600..800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&family=Righteous&family=Rubik:ital,wght@0,500..800;1,500..800&family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#050A07] text-[#F3F6F3] antialiased selection:bg-[#D4AF37]/30 selection:text-[#FEF3C7]">
    <div id="root">
      <div id="cg-boot-shell" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050A07;color:#E6EFE9;font-family:'DM Sans',system-ui,sans-serif;padding:24px;">
        <div style="text-align:center;max-width:360px;">
          <div style="width:40px;height:40px;margin:0 auto 14px;border-radius:12px;border:2px solid rgba(212,175,55,0.35);border-top-color:#10B981;animation:cgSpin 0.9s linear infinite;"></div>
          <div style="font-size:15px;font-weight:700;color:#FFFFFF;letter-spacing:-0.01em;">Loading SkaDoosh Studio...</div>
          <div id="cg-boot-status" style="margin-top:6px;font-size:12px;color:#94A89C;">Connecting to studio workspace</div>
          <button id="cg-boot-reload" onclick="window.location.reload()" style="display:none;margin:16px auto 0;padding:8px 16px;border-radius:8px;background:#059669;color:#FFFFFF;border:1px solid rgba(245,196,81,0.45);font-size:12px;font-weight:600;cursor:pointer;">Reload Studio</button>
        </div>
      </div>
      <style>@keyframes cgSpin { to { transform: rotate(360deg); } }</style>
    </div>
    <script>
      (function () {
        var timer = setTimeout(function () {
          if (window.__CLIPGENIUS_MOUNTED__) return;
          try {
            var retries = Number(window.sessionStorage.getItem('clipgenius_boot_retry') || '0');
            if (retries < 1) {
              window.sessionStorage.setItem('clipgenius_boot_retry', String(retries + 1));
              window.location.reload();
              return;
            }
          } catch (e) {}
          var statusEl = document.getElementById('cg-boot-status');
          var btnEl = document.getElementById('cg-boot-reload');
          if (statusEl) statusEl.textContent = 'The studio took longer than expected to load (server may have just restarted).';
          if (btnEl) btnEl.style.display = 'inline-block';
        }, 7000);
        window.addEventListener('error', function (ev) {
          if (!window.__CLIPGENIUS_MOUNTED__ && ev && ev.target && ev.target.tagName === 'SCRIPT') {
            clearTimeout(timer);
            try {
              var retries = Number(window.sessionStorage.getItem('clipgenius_boot_retry') || '0');
              if (retries < 1) {
                window.sessionStorage.setItem('clipgenius_boot_retry', String(retries + 1));
                window.location.reload();
                return;
              }
            } catch (e) {}
            var statusEl = document.getElementById('cg-boot-status');
            var btnEl = document.getElementById('cg-boot-reload');
            if (statusEl) statusEl.textContent = 'Module bundle refreshed on server. Click below to reload.';
            if (btnEl) btnEl.style.display = 'inline-block';
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
